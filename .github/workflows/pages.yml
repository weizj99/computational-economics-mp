# Publish the course website (the 06_teaching folder) with GitHub Pages.
# It runs whenever main changes, and can also be started by hand.
name: Publish the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # The website is published from the public repository only.
    if: github.repository == 'weizj99/computational-economics-mp'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 06_teaching
      - id: deployment
        uses: actions/deploy-pages@v4
