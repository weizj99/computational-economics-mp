[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-economy-teaching"
version = "0.1.0"
description = "An independent Python teaching implementation of a two-period oligopoly economy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
qmp-economy = "qmp.__main__:main"

[tool.setuptools]
packages = ["qmp"]
